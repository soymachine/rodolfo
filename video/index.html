<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una manzana para la sed</title>
<style>
  @font-face { font-family: "Inter Tight"; font-weight: 500; src: url(fonts/inter-tight-latin-500-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 600; src: url(fonts/inter-tight-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 700; src: url(fonts/inter-tight-latin-700-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 800; src: url(fonts/inter-tight-latin-800-normal.woff2) format("woff2"); }
  @font-face { font-family: "Inter Tight"; font-weight: 900; src: url(fonts/inter-tight-latin-900-normal.woff2) format("woff2"); }
  html, body { margin: 0; background: #ece4d2; color: #1c1b1a; font-family: "Inter Tight", Helvetica, Arial, sans-serif; }
  canvas { display: block; width: 100%; max-width: 1920px; height: auto; margin: 0 auto; aspect-ratio: 16 / 9; }
  #ui { display: flex; gap: 12px; align-items: center; max-width: 1920px; margin: 10px auto; padding: 0 16px; box-sizing: border-box; font-size: 20px; }
  #ui button { font: inherit; background: #d6422a; color: #fff; border: 0; padding: 6px 16px; cursor: pointer; }
  #ui input { flex: 1; accent-color: #d6422a; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui" hidden>
  <button id="play">▶ Reproducir</button>
  <input id="seek" type="range" min="0" max="69" step="0.01" value="0">
  <span id="time">0.00 s</span>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
