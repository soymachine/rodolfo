<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Una manzana para la sed</title>
<style>
  @font-face { font-family: "Cormorant Garamond"; font-weight: 300; font-style: normal; src: url(fonts/cormorant-garamond-latin-300-normal.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 300; font-style: italic; src: url(fonts/cormorant-garamond-latin-300-italic.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 400; font-style: italic; src: url(fonts/cormorant-garamond-latin-400-italic.woff2) format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: normal; src: url(fonts/cormorant-garamond-latin-500-normal.woff2) format("woff2"); }
  html, body { margin: 0; background: #0b0a09; color: #efe6d6; font-family: "Cormorant Garamond", Georgia, serif; }
  canvas { display: block; width: 100%; max-width: 1920px; height: auto; margin: 0 auto; aspect-ratio: 16 / 9; }
  #ui { display: flex; gap: 12px; align-items: center; max-width: 1920px; margin: 10px auto; padding: 0 16px; box-sizing: border-box; font-size: 20px; }
  #ui button { font: inherit; background: #b3261e; color: #fff; border: 0; padding: 6px 16px; cursor: pointer; }
  #ui input { flex: 1; accent-color: #b3261e; }
  body.render #ui { display: none; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="ui" hidden>
  <button id="play">▶ Reproducir</button>
  <input id="seek" type="range" min="0" max="69" step="0.01" value="0">
  <span id="time">0.00 s</span>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
